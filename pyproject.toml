[project]
name = "massgat"
requires-python = ">=3.8,<=3.11"
version = "0.1.0"
license = "CECILL-2.1"
authors = [
  { name = "Paul-Henri Pinart", email = "Paul-Henri.PINART@cea.fr" },
  { name = "Sylvain Dechaumet", email = "sylvain.dechaumet@cea.fr" },
  { name = "Etienne Thevenot", email = "Etienne.THEVENOT@cea.fr" }
]
maintainers = [
  { name = "Paul-Henri Pinart", email = "Paul-Henri.PINART@cea.fr" }
]
keywords = ["machine-learning", "graph-neural-networks", "lc-ms", "metabolomics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python",
    "Topic :: Scientific/Engineering :: Bio-Informatics"
]
dependencies = [
  "torch>=2.0.0",
  "mlflow",
  "pandas",
  "numpy>=1.22.0",
  "torch-geometric",
  "pyyaml",
  "openpyxl",
  "scipy",
  "matplotlib",
  "seaborn",
  "pyarrow",
  "scikit-learn",
  "protobuf"
]

[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = [
  "win-64",
  "linux-64",
  { name = "win-64-cuda", platform = "win-64", cuda = "12.6" },
  { name = "linux-64-cuda", platform = "linux-64", cuda = "12.6" }
]

[tool.setuptools]
packages = ["src"]

[tool.pixi.dependencies]
compilers = "*"
cmake = "*"
make = "*"
r-base = ">=4.5.0"
r-arrow = ">=25.0.0"
r-yaml = ">=2.3.12"


[tool.pixi.feature.gpu]
platforms = ["linux-64-cuda", "win-64-cuda"]

[tool.pixi.feature.gpu.dependencies]
cuda-version = ">=12.0"
pytorch-gpu = ">=2.0.0"

[tool.pixi.feature.cpu]
platforms = ["linux-64", "win-64"]

[tool.pixi.feature.cpu.dependencies]
pytorch-cpu = ">=2.0.0"

[tool.pixi.pypi-dependencies]
massgat = { path = ".", editable = true }

[tool.pixi.environments]
default = { features = ["cpu"] }
gpu = { features = ["gpu"] }
cpu = { features = ["cpu"] }

[tool.pixi.tasks]
test-gpu = "python -c 'import torch; print(torch.cuda.is_available())'"
install-ionshed = "Rscript environment/install_package.R"
